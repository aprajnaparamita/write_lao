name: write_it_lao
description: "Learn to write the Lao alphabet through guided stroke-by-stroke practice."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.0
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  path: ^1.9.0
  go_router: ^14.0.0
  uuid: ^4.0.0
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/stroke_data/
    - assets/audio/
    - assets/audio/pronunciation/
    - assets/images/
    - assets/images/acrophonical/
    - assets/vocab/
    - assets/vocab/images/
    - assets/vocab/audio/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  linux:
    generate: true
  web:
    generate: true
  image_path: "assets/icon/app_icon.png"
