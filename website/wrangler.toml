# Write Lao — Cloudflare Workers Configuration
#
# Deployment:
#   wrangler deploy

name = "writelao-website"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Main landing page (public)
main = "src/website/index.ts"

# Static assets served from Cloudflare's CDN (not bundled in the Worker)
[assets]
directory = "./public"
binding = "ASSETS"

# D1 database for teacher accounts and course content (create via `wrangler d1 create writelao-db`)
[[d1_databases]]
binding = "DB"
database_name = "writelao-db"
database_id = "fbf83e3b-4727-4dde-be41-c0176c0b9673"

# R2 bucket for course data (audio files, images, examples) (create via `wrangler r2 bucket create writelao-course-data`)
[[r2_buckets]]
binding = "COURSE_DATA"
bucket_name = "writelao-course-data"

[vars]
ENVIRONMENT = "production"
# Your CloudFlare account ID (find it in the CloudFlare dashboard URL: dash.cloudflare.com/<ACCOUNT_ID>)
ACCOUNT_ID = "98b0001d9df14f1175c1543acee869ef"

# Secrets to set via `wrangler secret put`:
# - TEACHER_JWT_SECRET: Secret key for signing teacher session tokens
# - ADMIN_EMAIL: Email address for teacher verification
# - GOOGLE_CLIENT_ID: OAuth client ID for Google sign-in
# - GOOGLE_CLIENT_SECRET: OAuth client secret
# - BREVO_API_KEY: API key from brevo.com for sending support form emails
# - R2_ACCESS_KEY_ID: R2 API token access key (from R2 → Manage API Tokens)
# - R2_SECRET_ACCESS_KEY: R2 API token secret key
